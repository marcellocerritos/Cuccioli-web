# Publica el frontend en Firebase Hosting (cuccioli-sv.web.app) cada vez que cambia main.
# El backend (Cloudflare Worker cuccioli-api) se despliega aparte con Cloudflare Workers Builds.
name: Publicar frontend en Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: cuccioli-75a42
          channelId: live
